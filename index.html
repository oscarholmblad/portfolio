<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Ikonen som visas om sidan sparas på hemskärmen -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Oscar Holmblad" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#13281d" />
    <meta
      name="description"
      content="Oscar Holmblad, frontendutvecklare under utbildning i Karlstad. Här finns mina projekt, mitt CV och hur du når mig."
    />

    <!-- Förhandsvisningen som visas när länken delas, t.ex. på LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://oscarholmblad.vercel.app/" />
    <meta property="og:title" content="Oscar Holmblad | Frontendutvecklare" />
    <meta
      property="og:description"
      content="Frontendutvecklare under utbildning i Karlstad. Här finns mina projekt, mitt CV och hur du når mig."
    />
    <meta
      property="og:image"
      content="https://oscarholmblad.vercel.app/images/og.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Oscar Holmblad, frontendutvecklare under utbildning i Karlstad"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Typsnitten ligger i public/fonts och hämtas direkt, så att texten inte hoppar -->
    <link
      rel="preload"
      href="/fonts/fraunces-latin-opsz-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/instrument-sans-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Oscar Holmblad | Frontendutvecklare</title>
  </head>
  <body class="bg-forest text-birch antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
